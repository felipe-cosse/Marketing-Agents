templates:
  - id: tpl.email.newsletter.newsletter-subscriber
    display_name: Newsletter Subscriber
    department_id: dept.email
    function_id: func.email.newsletter
    display_order: 10
    purpose: Add new website signups to the configured newsletter system; the source chart names Loops.
    system_prompt_ref: prompts/tpl.email.newsletter.newsletter-subscriber.md
    input_schema_ref: schemas/tpl.email.newsletter.newsletter-subscriber/input.schema.json
    output_schema_ref: schemas/tpl.email.newsletter.newsletter-subscriber/output.schema.json
    allowed_tool_capability_ids: [cap.newsletter.subscribe]
    supported_trigger_types: [manual, webhook]
    operation_classification: mutating
    approval_policy_id: policy.human-approval.external-write.v1
    retry_policy: {max_attempts: 1, backoff: none}
    timeout_policy: {step_seconds: 30, run_seconds: 120}
    budget_policy: {max_steps: 5, max_model_calls: 0, max_tool_calls: 1}
    rate_limit_policy: {max_calls: 20, window_seconds: 60}
    source_confidence: high
    source_references: [IMPLEMENTATION_PROMPT.md#newsletter--2]
    implementation_notes: Loops is preserved only as source-chart evidence; the connector binding is configurable and write execution requires exact approval.
