name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  clean-local-startup:
    needs: [catalog, backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify isolated committed local startup and offline suites
        run: make verify-clean REF=HEAD REPORT="$RUNNER_TEMP/clean-startup-diagnostics.json"
      - name: Preserve sanitized clean-startup diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: clean-startup-diagnostics
          path: ${{ runner.temp }}/clean-startup-diagnostics.json
          retention-days: 7
          if-no-files-found: warn

  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.10.7
          enable-cache: true
      - name: Acquire pinned Python dependencies
        run: uv sync --frozen --python 3.12
      - name: Verify hash-pinned authoritative catalog
        run: make verify-catalog-release
      - name: Run complete catalog contract suite
        run: uv run pytest -q tests/catalog

  backend:
    needs: catalog
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.10.7
          enable-cache: true
      - name: Acquire pinned Python dependencies
        run: uv sync --frozen --python 3.12
      - name: Verify backend
        run: make verify-backend

  frontend:
    needs: catalog
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Activate pinned pnpm
        run: corepack enable
      - name: Acquire pinned frontend dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Verify frontend
        run: make verify-web

  browser:
    needs: [catalog, backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.10.7
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Activate pinned pnpm
        run: corepack enable
      - name: Acquire pinned Python dependencies
        run: uv sync --frozen --python 3.12
      - name: Acquire pinned frontend dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Acquire Playwright-managed Chromium
        run: corepack pnpm --dir apps/web browser:install:ci
      - name: Verify the real browser/API boundary
        run: make web-test-e2e
      - name: Preserve browser failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-failure-evidence
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          retention-days: 7
          if-no-files-found: warn

  governance:
    needs: catalog
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare retained requirement refs from GitHub
        run: python3 scripts/prepare_ci_history.py
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.10.7
          enable-cache: true
      - name: Acquire pinned Python dependencies
        run: uv sync --frozen --python 3.12
      - name: Verify source and requirement governance
        run: make verify-governance
