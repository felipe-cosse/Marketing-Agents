# DEL-05: only the local web origin is accepted; upstream remains loopback-bound.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    client_max_body_size 1m;
    client_body_timeout 15s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    map $http_host $local_host {
        default 0;
        "~*^localhost(:[0-9]{1,5})?$" 1;
        "~^127\.0\.0\.1(:[0-9]{1,5})?$" 1;
    }
    server {
        listen 8080 default_server;
        server_name localhost 127.0.0.1;
        root /usr/share/nginx/html;
        if ($local_host = 0) { return 400; }
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        location ~ ^/(api/|health/) {
            proxy_pass http://unix:/var/run/marketing-agents/api.sock;
            proxy_http_version 1.1;
            proxy_connect_timeout 2s;
            proxy_read_timeout 35s;
            proxy_send_timeout 15s;
            proxy_buffering off;
            proxy_request_buffering on;
            # An allowlist strips EVERY caller-supplied forwarding/identity header.
            proxy_pass_request_headers off;
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";
            proxy_set_header Accept $http_accept;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Content-Type $http_content_type;
            proxy_set_header Content-Encoding $http_content_encoding;
            proxy_set_header Origin $http_origin;
            proxy_set_header Sec-Fetch-Site $http_sec_fetch_site;
            proxy_set_header X-CSRF-Token $http_x_csrf_token;
            proxy_set_header Idempotency-Key $http_idempotency_key;
            proxy_set_header If-Match $http_if_match;
            proxy_set_header If-None-Match $http_if_none_match;
            proxy_set_header X-Webhook-Timestamp $http_x_webhook_timestamp;
            proxy_set_header X-Webhook-Signature $http_x_webhook_signature;
        }
        location /assets/ {
            try_files $uri =404;
        }
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
